<div>
  <button class="button" (click)="nextPage()">Вперёд</button>
  <button class="button" (click)="previousPage()">Назад</button>
</div>

<div>{{ page$ | async }}</div>

<hr>

<div class="todo-list">
  @for (todo of todos$ | async; track todo.id) {
    <app-todo [todo]="todo"></app-todo>
  }
</div>
